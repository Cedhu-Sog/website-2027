            options_length: 100
            hint: >-
              Selecciona una fotografía de la biblioteca. Para agregar una, crea primero su ficha en
              «Fotografías». Las referencias nuevas se seleccionan después de aprobar esa ficha.
      - name: poster
        label: Comunicado original (fotografía)
        required: false
        widget: relation
        collection: medios
        value_field: "{{slug}}"
        search_fields:
