# Configuración estándar de Decap CMS. Ver docs/DECAPCMS_ADMINISTRACION.md.
# Los alias YAML reutilizan campos idénticos entre páginas.
backend:
  name: github
  repo: Cedhu-Sog/website-2027
  branch: master
  base_url: https://website-2027-bay.vercel.app
  auth_endpoint: api/cms/auth
  auth_scope: public_repo
  preview_context: Vercel
  commit_messages:
    create: "contenido: crear {{collection}} «{{slug}}»"
    update: "contenido: actualizar {{collection}} «{{slug}}»"
    delete: "contenido: retirar {{collection}} «{{slug}}»"
    uploadMedia: "medios: cargar «{{path}}»"
    deleteMedia: "medios: retirar «{{path}}»"
locale: es
publish_mode: editorial_workflow
site_url: https://website-2027-bay.vercel.app
display_url: https://website-2027-bay.vercel.app
logo_url: /favicon.ico
media_folder: src/assets/uploads
public_folder: /src/assets/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
collections:
  - name: noticias
    label: Noticias
    label_singular: Noticias
    folder: src/content/noticias
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    editor:
      preview: false
    fields:
      - &ref_0
        name: title
        label: Título
        required: true
        widget: string
        pattern:
          - .*\S.*
          - Este campo no puede quedar vacío.
      - &ref_1
        name: description
        label: Descripción
        required: true
        widget: text
        pattern:
          - .*\S.*
          - Este campo no puede quedar vacío.
      - &ref_32
        name: date
        label: Fecha de publicación confirmada
        required: false
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
        picker_utc: false
        default: ""
        hint: Usa únicamente una fecha confirmada. La fecha no programa un despliegue automático.
      - &ref_22
        name: image
        label: Fotografía
        required: true
        widget: relation
        collection: medios
        value_field: "{{slug}}"
        search_fields:
          - title
          - alt
        display_fields:
          - title
        options_length: 100
        hint: >-
          Selecciona una fotografía de la biblioteca. Para agregar una, crea primero su ficha en
          «Fotografías». Las referencias nuevas se seleccionan después de aprobar esa ficha.
      - &ref_21
        name: category
        label: Categoría
        required: true
        widget: string
        pattern:
          - .*\S.*
          - Este campo no puede quedar vacío.
      - &ref_35
        name: featured
        label: Destacar en el sitio
        required: false
        widget: boolean
        default: false
      - &ref_8
        name: seo
        label: Opciones para buscadores y redes sociales
        required: false
        widget: object
        collapsed: true
        fields:
          - name: title
            label: Título
            required: false
            widget: string
          - name: description
            label: Descripción
            required: false
            widget: text
            pattern:
              - ^[\s\S]{1,180}$
              - Máximo 180 caracteres.
          - &ref_23
            name: image
            label: Fotografía
            required: false
            widget: relation
            collection: medios
            value_field: "{{slug}}"
            search_fields:
              - title
