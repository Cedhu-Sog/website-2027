            label: Texto del botón de ubicación
            widget: string
            required: true
          - name: whatsappLabel
            label: Texto del botón de WhatsApp
            widget: string
            required: true
      - &ref_13
        name: order
        label: Orden de presentación
        required: true
        widget: number
        value_type: int
        min: 0
        default: 100
      - name: featuredOrder
        label: Orden entre las noticias destacadas
        required: true
        widget: number
        value_type: int
        min: 0
        default: 100
      - &ref_36
        name: draft
        label: Retirar u ocultar del sitio público
        required: false
        widget: boolean
        default: false
        hint: >-
          Este interruptor oculta el contenido incluso después de aprobarlo. Para publicarlo, desactívalo y
          completa la revisión editorial. Guardar un borrador del flujo editorial no cambia producción.
      - name: body
        label: Contenido completo
        widget: markdown
        required: true
        modes:
          - rich_text
        sanitize_preview: true
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
        hint: Usa encabezados de nivel 2 o 3. Cada fotografía del contenido necesita texto alternativo.
    preview_path: noticias/{{slug}}/
    summary: "{{title}}"
    sortable_fields:
      - title
      - date
      - order
