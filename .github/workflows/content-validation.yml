name: Contenido institucional
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validar-contenido:
    name: Validación de contenido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:cms
      - run: node --test scripts/proyectos/google-login.test.mjs
      - run: npm run build
      - run: node scripts/check-personal.mjs
